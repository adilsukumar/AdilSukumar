<svg width="100%" viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code','Cascadia Code',Consolas,monospace">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#84C2C0"/>
      <stop offset="50%" stop-color="#6DD5FA"/>
      <stop offset="100%" stop-color="#A18AFF"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <clipPath id="c0"><rect x="24" y="52" width="0" height="24"><animate attributeName="width" from="0" to="320" begin="0.3s" dur="0.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="c1"><rect x="24" y="80" width="0" height="24"><animate attributeName="width" from="0" to="465" begin="1.1s" dur="0.8s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="24" y="108" width="0" height="24"><animate attributeName="width" from="0" to="395" begin="2.0s" dur="0.8s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="24" y="136" width="0" height="24"><animate attributeName="width" from="0" to="385" begin="2.9s" dur="0.8s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="24" y="164" width="0" height="24"><animate attributeName="width" from="0" to="405" begin="3.8s" dur="0.8s" fill="freeze"/></rect></clipPath>
    <clipPath id="c5"><rect x="24" y="192" width="0" height="24"><animate attributeName="width" from="0" to="425" begin="4.7s" dur="0.8s" fill="freeze"/></rect></clipPath>
    <clipPath id="c6"><rect x="24" y="220" width="0" height="24"><animate attributeName="width" from="0" to="250" begin="5.6s" dur="0.6s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect x="1" y="1" width="758" height="298" rx="16" fill="#0d1117" stroke="url(#borderGrad)" stroke-width="2"/>

  <line x1="1" y1="34" x2="759" y2="34" stroke="#21262d" stroke-width="1"/>
  <circle cx="26" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="70" cy="17" r="6" fill="#27c93f"/>
  <text x="380" y="22" text-anchor="middle" font-size="12" fill="#8b949e">adil@github: ~/about-me.sh</text>

  <g font-size="16">
    <text x="24" y="70" clip-path="url(#c0)" fill="#6DD5FA">guest@adilsukumar:~$ whoami</text>
    <text x="24" y="98" clip-path="url(#c1)" fill="#84C2C0">Adil Sukumar — Student, Builder &amp; Learner</text>
    <text x="24" y="126" clip-path="url(#c2)" fill="#6DD5FA">guest@adilsukumar:~$ cat focus.txt</text>
    <text x="24" y="154" clip-path="url(#c3)" fill="#A18AFF">C++ · Python · Full-Stack Web Dev</text>
    <text x="24" y="182" clip-path="url(#c4)" fill="#6DD5FA">guest@adilsukumar:~$ cat status.txt</text>
    <text x="24" y="210" clip-path="url(#c5)" fill="#84C2C0">Open to AI open-source collaborations</text>
    <text x="24" y="238" clip-path="url(#c6)" fill="#6DD5FA">guest@adilsukumar:~$</text>
  </g>

  <rect x="235" y="222" width="9" height="18" fill="#e6edf3" opacity="0">
    <set attributeName="opacity" to="0" begin="0s" dur="6.2s"/>
    <animate attributeName="opacity" values="1;0;1" dur="1s" begin="6.2s" repeatCount="indefinite"/>
  </rect>
</svg>
