<svg width="100%" viewBox="0 0 760 240" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code','Cascadia Code',Consolas,monospace">
  <defs>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84C2C0"/>
      <stop offset="50%" stop-color="#6DD5FA"/>
      <stop offset="100%" stop-color="#A18AFF"/>
    </linearGradient>
    <linearGradient id="borderGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A18AFF"/>
      <stop offset="50%" stop-color="#6DD5FA"/>
      <stop offset="100%" stop-color="#84C2C0"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="758" height="238" rx="16" fill="#0d1117" stroke="url(#borderGrad2)" stroke-width="2"/>

  <circle cx="150" cy="120" r="100" fill="none" stroke="#30363d" stroke-width="1"/>
  <circle cx="150" cy="120" r="75" fill="none" stroke="#30363d" stroke-width="1"/>
  <circle cx="150" cy="120" r="50" fill="none" stroke="#30363d" stroke-width="1"/>

  <circle cx="150" cy="120" r="30" fill="url(#coreGrad)">
    <animate attributeName="r" values="30;33;30" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="150" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#0d1117">&lt;/&gt;</text>

  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 150 120" to="360 150 120" dur="9s" repeatCount="indefinite"/>
    <circle cx="250" cy="120" r="7" fill="#84C2C0"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 150 120" to="0 150 120" dur="15s" repeatCount="indefinite"/>
    <circle cx="225" cy="120" r="6" fill="#6DD5FA"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 150 120" to="360 150 120" dur="21s" repeatCount="indefinite"/>
    <circle cx="200" cy="120" r="5" fill="#A18AFF"/>
  </g>

  <g font-size="15" fill="#c9d1d9">
    <circle cx="345" cy="60" r="5" fill="#84C2C0"/>
    <text x="360" y="65">Languages — C++ · Python</text>

    <circle cx="345" cy="100" r="5" fill="#6DD5FA"/>
    <text x="360" y="105">Web — HTML · CSS · JS</text>

    <circle cx="345" cy="140" r="5" fill="#A18AFF"/>
    <text x="360" y="145">Cloud — AWS · Firebase · Supabase</text>

    <circle cx="345" cy="180" r="5" fill="#84C2C0"/>
    <text x="360" y="185">Hardware — ESP32 · Arduino</text>
  </g>

  <text x="150" y="220" text-anchor="middle" font-size="12" fill="#8b949e">always orbiting new tech</text>
</svg>
