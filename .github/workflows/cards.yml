name: Update README Cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "profile/**"

permissions:
  contents: write

concurrency:
  group: readme-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=AdilSukumar&show_icons=true&title_color=6DD5FA&icon_color=A18AFF&text_color=c9d1d9&bg_color=00000000&border_color=30363d&border_radius=16
          path: profile/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=AdilSukumar&show_icons=true&title_color=6d28d9&icon_color=0d9488&text_color=24292f&bg_color=00000000&border_color=d0d7de&border_radius=16
          path: profile/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=AdilSukumar&layout=compact&title_color=6DD5FA&text_color=c9d1d9&bg_color=00000000&border_color=30363d&border_radius=16
          path: profile/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=AdilSukumar&layout=compact&title_color=6d28d9&text_color=24292f&bg_color=00000000&border_color=d0d7de&border_radius=16
          path: profile/top-langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check out official trophy generator
        uses: actions/checkout@v4
        with:
          repository: ryo-ma/github-profile-trophy
          ref: master
          path: trophy-src

      - name: Set up Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Trophy card (dark)
        working-directory: trophy-src
        env:
          GITHUB_TOKEN1: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN2: ${{ secrets.GITHUB_TOKEN }}
        run: deno run --allow-net --allow-env --allow-read --allow-write ./render_svg.ts AdilSukumar ../profile/trophy-dark.svg tokyonight

      - name: Trophy card (light)
        working-directory: trophy-src
        env:
          GITHUB_TOKEN1: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN2: ${{ secrets.GITHUB_TOKEN }}
        run: deno run --allow-net --allow-env --allow-read --allow-write ./render_svg.ts AdilSukumar ../profile/trophy-light.svg flat

      - name: Update open source contributions list
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const query = `
              query($login: String!) {
                user(login: $login) {
                  repositoriesContributedTo(
                    first: 100
                    includeUserRepositories: false
                    contributionTypes: [COMMIT, ISSUE, PULL_REQUEST, PULL_REQUEST_REVIEW, REPOSITORY]
                  ) {
                    nodes {
                      nameWithOwner
                      url
                      description
                      stargazerCount
                      primaryLanguage { name }
                    }
                  }
                }
              }
            `;

            const result = await github.graphql(query, { login: 'AdilSukumar' });
            const repos = result.user.repositoriesContributedTo.nodes;
            repos.sort((a, b) =>
              b.stargazerCount - a.stargazerCount ||
              a.nameWithOwner.localeCompare(b.nameWithOwner)
            );

            let table;
            if (repos.length === 0) {
              table = '_No external contributions found yet._';
            } else {
              table = '| Repository | Description | Language | Stars |\n|---|---|---|---|\n';
              for (const r of repos) {
                const desc = (r.description || '_No description_')
                  .replace(/\|/g, '\\|')
                  .replace(/\r?\n/g, ' ')
                  .slice(0, 160);
                const lang = r.primaryLanguage ? r.primaryLanguage.name : '—';
                table += `| [${r.nameWithOwner}](${r.url}) | ${desc} | ${lang} | ${r.stargazerCount} |\n`;
              }
            }

            const start = '<!-- CONTRIB:START -->';
            const end = '<!-- CONTRIB:END -->';
            const readme = fs.readFileSync('README.md', 'utf8');
            const startIdx = readme.indexOf(start);
            const endIdx = readme.indexOf(end);
            if (startIdx === -1 || endIdx === -1) {
              core.setFailed('Contribution markers not found in README.md');
              return;
            }
            const updated =
              readme.slice(0, startIdx + start.length) +
              '\n\n' + table + '\n\n' +
              readme.slice(endIdx);
            fs.writeFileSync('README.md', updated);

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg README.md
          git diff --staged --quiet || git commit -m "chore: update README cards [skip ci]"
          git push
