name: Update public project directory
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/project_directory.py
      - scripts/visuals.py
      - scripts/repo_art.py
      - .github/workflows/project-directory.yml
permissions:
  contents: write
# Shared with the existing card workflow: updates to README never overlap.
concurrency:
  group: readme-cards
  cancel-in-progress: false
jobs:
  directory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh public repository sectors
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/project_directory.py
      - name: Commit directory if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/directory
          git diff --staged --quiet || git commit -m 'docs: refresh public project directory [skip ci]'
          git pull --rebase origin main
          git push
